apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: keycloak-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: keycloak
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.service: keycloak
    spec:
      priorityClassName: critical-apps
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.6.4
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 500m
              memory: 4Gi
            limits:
              cpu: "2"
              memory: 4Gi
          startupProbe:
            httpGet:
              path: /health/live
              port: 9000
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: 9000
            periodSeconds: 30
            failureThreshold: 5
          args:
            - start
            - --log-level=INFO,org.keycloak.events:DEBUG
            - --cache-stack=kubernetes
            - --proxy-headers=xforwarded
            - --health-enabled=true
            - --http-enabled=true
            - --log=console,file,syslog
          env:
            - name: JAVA_OPTS_APPEND
              value: -Djgroups.dns.query=allkeycloaks -XX:UseAVX=2 -Xms512m -Xmx2g
            - name: KC_DB
              value: mariadb
            - name: KC_DB_POOL_INITIAL_SIZE
              value: "5"
            - name: KC_DB_POOL_MIN_SIZE
              value: "5"
            - name: KC_DB_URL
              value: jdbc:mariadb://mariadb01.db.gewis.nl/auth_prod?sslMode=REQUIRED
            - name: KC_FEATURES
              value: recovery-codes,scripts,account:v3
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_HOSTNAME
              value: https://auth.gewis.nl
            - name: KC_HOSTNAME_ADMIN
              value: https://auth-admin.gewis.nl
            - name: KC_METRICS_ENABLED
              value: "false"
            - name: QUARKUS_TRANSACTION_MANAGER_ENABLE_RECOVERY
              value: "true"
            - name: TZ
              value: Europe/Amsterdam
          envFrom:
            - secretRef:
                name: keycloak-secrets
          ports:
            - containerPort: 8080
              name: 8080tcp
              protocol: TCP
            - containerPort: 9000
              name: 9000tcp
              protocol: TCP
          volumeMounts:
            - mountPath: /kerberos_conf
              name: kerberos
            - mountPath: /opt/keycloak/data/log
              name: logs
      volumes:
        - name: kerberos
          persistentVolumeClaim:
            claimName: kerberos
        - name: logs
          persistentVolumeClaim:
            claimName: logs
