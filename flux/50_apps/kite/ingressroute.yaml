apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: kite
  namespace: kite
  annotations:
    external-dns.alpha.kubernetes.io/target: router02.net.gewis.nl
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`kite.cbc.gewis.nl`)
      kind: Rule
      services:
        - name: kite
          port: 8080
  tls: {}
