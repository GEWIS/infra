apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kite
  namespace: kite
spec:
  releaseName: kite
  interval: 1h
  chart:
    spec:
      chart: kite
      version: "0.16.0"
      sourceRef:
        kind: HelmRepository
        name: kite
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    host: https://kite.cbc.gewis.nl:8443
    deploymentStrategy:
      type: Recreate
    secret:
      create: false
      existingSecret: kite-keys
    db:
      sqlite:
        persistence:
          pvc:
            enabled: true
    extraEnvs:
      - name: OAUTH_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: kite-oidc
            key: client_secret
      - name: KITE_ADMIN_PASSWORD
        valueFrom:
          secretKeyRef:
            name: kite-admin
            key: password
    rbac:
      rules:
        - apiGroups: ["*"]
          resources: ["*"]
          verbs: ["get", "list", "watch"]
        - apiGroups: [""]
          resources: ["pods"]
          verbs: ["delete"]
        - apiGroups: [""]
          resources: ["pods/exec"]
          verbs: ["create"]
    config:
      enabled: true
      superUser:
        username: admin
        password: ${KITE_ADMIN_PASSWORD}
      clusters:
        - name: gewis-prod
          inCluster: true
          default: true
      oauth:
        - name: authentik
          clientId: kite
          clientSecret: ${OAUTH_CLIENT_SECRET}
          issuer: https://authentik.cbc.gewis.nl:8443/application/o/kite/
          scopes: openid,profile,email
          usernameClaim: preferred_username
          groupsClaim: groups
          enabled: true
      rbac:
        roles:
          - name: crd-reader
            description: List CustomResourceDefinitions, so the CRD pages load
            clusters: ["*"]
            namespaces: ["*"]
            resources: ["crds"]
            verbs: ["get"]
        roleMapping:
          - name: admin
            oidcGroups: ["CBC - Application Hosting Team (ADM)"]
          - name: crd-reader
            users: ["*"]
