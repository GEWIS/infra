apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kite
  namespace: kite
spec:
  releaseName: kite
  interval: 1h
  dependsOn:
    - name: kite-config
  chart:
    spec:
      chart: kite
      version: "0.16.0"
      sourceRef:
        kind: HelmRepository
        name: kite
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    host: https://kite.gewis.nl
    deploymentStrategy:
      type: Recreate
    secret:
      create: false
      existingSecret: kite-keys
    db:
      sqlite:
        persistence:
          pvc:
            enabled: true
    extraEnvs:
      - name: OAUTH_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: kite-oidc
            key: client_secret
      - name: KITE_ADMIN_PASSWORD
        valueFrom:
          secretKeyRef:
            name: kite-admin
            key: password
    rbac:
      rules:
        - apiGroups: ["*"]
          resources: ["*"]
          verbs: ["get", "list", "watch"]
        - apiGroups: [""]
          resources: ["pods"]
          verbs: ["delete"]
        - apiGroups: [""]
          resources: ["pods/exec"]
          verbs: ["create"]
    config:
      enabled: true
      existingSecret: kite-roles
