apiVersion: v1
kind: Service
metadata:
  name: gewiscontainer-lan
  namespace: external-proxy
spec:
  ports:
    - name: gewisweb
      port: 9210
      targetPort: 9210
    - name: gewisweb-images
      port: 9211
      targetPort: 9211
    - name: gewisweb-test
      port: 9200
      targetPort: 9200
    - name: ivv
      port: 9851
      targetPort: 9851
    - name: aliaslookup
      port: 9404
      targetPort: 9404
    - name: wiki
      port: 9676
      targetPort: 9676
    - name: sharelatex
      port: 9195
      targetPort: 9195
    - name: stirlingpdf
      port: 9860
      targetPort: 9860
    - name: supremum
      port: 9501
      targetPort: 9501
    - name: docker
      port: 9000
      targetPort: 9000
    - name: pgadmin
      port: 9411
      targetPort: 9411
    - name: analytics
      port: 9212
      targetPort: 9212
    - name: analytics-test
      port: 9202
      targetPort: 9202
    - name: xoa
      port: 9405
      targetPort: 9405
    - name: planka
      port: 9825
      targetPort: 9825
    - name: vaultwarden
      port: 9401
      targetPort: 9401
    - name: pkg
      port: 9001
      targetPort: 9001
    - name: registry
      port: 9101
      targetPort: 9101
    - name: registry-abc
      port: 9102
      targetPort: 9102
    - name: registry-board
      port: 9103
      targetPort: 9103
    - name: registry-cbc
      port: 9104
      targetPort: 9104
    - name: registry-supr
      port: 9107
      targetPort: 9107
    - name: registry-avico
      port: 9108
      targetPort: 9108
    - name: registry-cel
      port: 9110
      targetPort: 9110
    - name: registry-pdf
      port: 9111
      targetPort: 9111
    - name: registry-ivv
      port: 9112
      targetPort: 9112
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: gewiscontainer-lan
  namespace: external-proxy
  labels:
    kubernetes.io/service-name: gewiscontainer-lan
    endpointslice.kubernetes.io/managed-by: flux
addressType: IPv4
ports:
  - name: gewisweb
    port: 9210
    protocol: TCP
  - name: gewisweb-images
    port: 9211
    protocol: TCP
  - name: gewisweb-test
    port: 9200
    protocol: TCP
  - name: ivv
    port: 9851
    protocol: TCP
  - name: aliaslookup
    port: 9404
    protocol: TCP
  - name: wiki
    port: 9676
    protocol: TCP
  - name: sharelatex
    port: 9195
    protocol: TCP
  - name: stirlingpdf
    port: 9860
    protocol: TCP
  - name: supremum
    port: 9501
    protocol: TCP
  - name: docker
    port: 9000
    protocol: TCP
  - name: pgadmin
    port: 9411
    protocol: TCP
  - name: analytics
    port: 9212
    protocol: TCP
  - name: analytics-test
    port: 9202
    protocol: TCP
  - name: xoa
    port: 9405
    protocol: TCP
  - name: planka
    port: 9825
    protocol: TCP
  - name: vaultwarden
    port: 9401
    protocol: TCP
  - name: pkg
    port: 9001
    protocol: TCP
  - name: registry
    port: 9101
    protocol: TCP
  - name: registry-abc
    port: 9102
    protocol: TCP
  - name: registry-board
    port: 9103
    protocol: TCP
  - name: registry-cbc
    port: 9104
    protocol: TCP
  - name: registry-supr
    port: 9107
    protocol: TCP
  - name: registry-avico
    port: 9108
    protocol: TCP
  - name: registry-cel
    port: 9110
    protocol: TCP
  - name: registry-pdf
    port: 9111
    protocol: TCP
  - name: registry-ivv
    port: 9112
    protocol: TCP
endpoints:
  - addresses:
      - 10.82.50.119
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: gewiscontainer
  namespace: external-proxy
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`ivv.gewis.nl`)
      services:
        - name: gewiscontainer-lan
          port: 9851
    - kind: Rule
      match: Host(`mail-api.gewis.nl`)
      services:
        - name: gewiscontainer-lan
          port: 9404
    - kind: Rule
      match: Host(`wiki.gewis.nl`)
      services:
        - name: gewiscontainer-lan
          port: 9676
    - kind: Rule
      match: Host(`gewiki.gewis.nl`)
      services:
        - name: gewiscontainer-lan
          port: 9676
    - kind: Rule
      match: Host(`latex.gewis.nl`)
      services:
        - name: gewiscontainer-lan
          port: 9195
    - kind: Rule
      match: Host(`pdf.gewis.nl`)
      services:
        - name: gewiscontainer-lan
          port: 9860
    - kind: Rule
      match: Host(`supremum.gewis.nl`) || Host(`inf.gewis.nl`)
      services:
        - name: gewiscontainer-lan
          port: 9501
    - kind: Rule
      match: Host(`docker.gewis.nl`)
      services:
        - name: gewiscontainer-lan
          port: 9000
    - kind: Rule
      match: Host(`pgadmin.gewis.nl`)
      middlewares:
        - name: tue-only
      services:
        - name: gewiscontainer-lan
          port: 9411
    - kind: Rule
      match: Host(`analytics.gewis.nl`)
      services:
        - name: gewiscontainer-lan
          port: 9212
    - kind: Rule
      match: Host(`analytics.test.gewis.nl`)
      services:
        - name: gewiscontainer-lan
          port: 9202
    - kind: Rule
      match: Host(`xoa.gewis.nl`)
      middlewares:
        - name: tue-only
      services:
        - name: gewiscontainer-lan
          port: 9405
    - kind: Rule
      match: Host(`planka.gewis.nl`)
      middlewares:
        - name: planka-headers
      services:
        - name: gewiscontainer-lan
          port: 9825
    - kind: Rule
      match: Host(`vault.gewis.nl`)
      services:
        - name: gewiscontainer-lan
          port: 9401
    - kind: Rule
      match: Host(`pkg.gewis.nl`)
      services:
        - name: gewiscontainer-lan
          port: 9001
    - kind: Rule
      match: Host(`test.gewis.nl`)
      services:
        - name: gewiscontainer-lan
          port: 9200
  tls: {}
