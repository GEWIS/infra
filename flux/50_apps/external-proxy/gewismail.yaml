apiVersion: netbird.io/v1alpha1
kind: NetworkEgress
metadata:
  name: gewismail
  namespace: external-proxy
spec:
  networkRouterRef:
    name: lan
    namespace: netbird-operator
  target:
    fqdn:
      hostname: gewismail.net.nb.gewis.nl
  ports:
    - name: https
      port: 443
    - name: http-lists
      port: 8000
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: gewismail
  namespace: external-proxy
spec:
  insecureSkipVerify: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: gewismail
  namespace: external-proxy
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`mail.gewis.nl`) || Host(`webmail.gewis.nl`)
      services:
        - name: gewismail
          port: 443
          scheme: https
          serversTransport: gewismail
    - kind: Rule
      match: Host(`lists.gewis.nl`)
      services:
        - name: gewismail
          port: 8000
  tls: {}
