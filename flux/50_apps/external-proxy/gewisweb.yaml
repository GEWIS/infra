apiVersion: v1
kind: Service
metadata:
  name: gewisweb-lan
  namespace: external-proxy
spec:
  ports:
    - name: phpmyadmin
      port: 8081
      targetPort: 8081
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: gewisweb-lan
  namespace: external-proxy
  labels:
    kubernetes.io/service-name: gewisweb-lan
    endpointslice.kubernetes.io/managed-by: flux
addressType: IPv4
ports:
  - name: phpmyadmin
    port: 8081
    protocol: TCP
endpoints:
  - addresses:
      - 10.82.50.120
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: gewisweb
  namespace: external-proxy
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`phpmyadmin.gewis.nl`)
      middlewares:
        - name: tue-only
      services:
        - name: gewisweb-lan
          port: 8081
  tls: {}
