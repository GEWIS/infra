apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: netbird
  namespace: netbird
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`nb.gewis.nl`) && (PathPrefix(`/relay`) || PathPrefix(`/ws-proxy`) || PathPrefix(`/oauth2`) || PathPrefix(`/api`))
      kind: Rule
      services:
        - name: netbird-service
          port: 80
    - match: Host(`nb.gewis.nl`) && (PathPrefix(`/signalexchange.SignalExchange`) || PathPrefix(`/management.ManagementService`) || PathPrefix(`/management.ProxyService`))
      kind: Rule
      services:
        - name: netbird-service
          port: 81
          scheme: h2c
    - match: Host(`nb.gewis.nl`)
      kind: Rule
      services:
        - name: dashboard
          port: 80
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: netbird-reverse-proxy
  namespace: netbird
spec:
  entryPoints:
    - websecure
  routes:
    - match: HostSNI(`print.gewis.nl`)
      services:
        - name: netbird-reverse-proxy
          port: 8443
  tls:
    passthrough: true
