apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbird-db
  namespace: netbird
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: postgres
    kind: SecretStore
  target:
    name: netbird-db
  data:
    - secretKey: DB_HOST
      remoteRef:
        key: netbird/netbird
        property: host
    - secretKey: DB_PORT
      remoteRef:
        key: netbird/netbird
        property: port
    - secretKey: DB_NAME
      remoteRef:
        key: netbird/netbird
        property: dbname
    - secretKey: DB_USER
      remoteRef:
        key: netbird/netbird
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: netbird/netbird
        property: password
