apiVersion: v1
kind: PersistentVolume
metadata:
  name: netbird-data
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: longhorn-static
  claimRef:
    namespace: netbird
    name: netbird-data
  csi:
    driver: driver.longhorn.io
    fsType: ext4
    volumeHandle: netbird-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: netbird-data
  namespace: netbird
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-static
  volumeName: netbird-data
  resources:
    requests:
      storage: 1Gi
