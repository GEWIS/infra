apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres
  namespace: authentik
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: postgres
  namespace: authentik
spec:
  provider:
    vault:
      server: http://openbao-active.openbao.svc:8200
      path: postgres
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: postgres-authentik
          serviceAccountRef:
            name: postgres
