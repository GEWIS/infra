apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zot-s3
  namespace: zot
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: seaweedfs
    kind: SecretStore
  target:
    name: zot-s3
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: zot/zot
        property: access_key_id
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: zot/zot
        property: secret_access_key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zot-oidc
  namespace: zot
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: keycloak
    kind: SecretStore
  target:
    name: zot-oidc
    template:
      data:
        credentials.json: '{{ dict "clientid" .client_id "clientsecret" .client_secret | toJson }}'
  data:
    - secretKey: client_id
      remoteRef:
        key: zot/zot
        property: client_id
    - secretKey: client_secret
      remoteRef:
        key: zot/zot
        property: client_secret
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: zot-session
  namespace: zot
spec:
  length: 64
  symbols: 0
  noUpper: false
  allowRepeat: true
  secretKeys:
    - hashKey
    - encryptKey
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zot-session
  namespace: zot
spec:
  refreshPolicy: CreatedOnce
  target:
    name: zot-session
    template:
      data:
        session-keys.json: '{{ dict "hashKey" .hashKey "encryptKey" (.encryptKey | trunc 32) | toJson }}'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: zot-session
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: zot-lan-reader
  namespace: zot
spec:
  length: 48
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zot-lan-reader
  namespace: zot
spec:
  refreshPolicy: CreatedOnce
  target:
    name: zot-lan-reader
    template:
      metadata:
        labels:
          reconcile.fluxcd.io/watch: Enabled
      data:
        values.yaml: '{{ dict "lanReader" (dict "password" .password) | toJson }}'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: zot-lan-reader
