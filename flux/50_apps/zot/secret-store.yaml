apiVersion: v1
kind: ServiceAccount
metadata:
  name: seaweedfs
  namespace: zot
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: seaweedfs
  namespace: zot
spec:
  provider:
    vault:
      server: http://openbao-active.openbao.svc:8200
      path: seaweedfs
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: seaweedfs-zot
          serviceAccountRef:
            name: seaweedfs
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keycloak
  namespace: zot
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: keycloak
  namespace: zot
spec:
  provider:
    vault:
      server: http://openbao-active.openbao.svc:8200
      path: keycloak
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: keycloak-zot
          serviceAccountRef:
            name: keycloak
