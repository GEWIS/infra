# Lives in kite, next to the app-access ConfigMap it reads, and installs into zot.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zot-app-access
  namespace: kite
spec:
  releaseName: zot-app-access
  targetNamespace: zot
  interval: 1h
  chart:
    spec:
      chart: ./charts/app-access
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: app-access
      valuesKey: values.yaml
  values:
    render: zotAccess
