apiVersion: v1
kind: Service
metadata:
  name: error-pages
  namespace: traefik
  labels:
    app.kubernetes.io/name: error-pages
spec:
  selector:
    app.kubernetes.io/name: error-pages
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: error-pages
  namespace: traefik
  labels:
    app.kubernetes.io/name: error-pages
    app.kubernetes.io/part-of: traefik
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: error-pages
  template:
    metadata:
      labels:
        app.kubernetes.io/name: error-pages
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginx:1.28-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /400.html
              port: http
          livenessProbe:
            httpGet:
              path: /400.html
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
      volumes:
        - name: nginx-config
          configMap:
            name: traefik-error-pages-nginx
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
