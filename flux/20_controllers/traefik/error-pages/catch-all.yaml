apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: error-pages-fallback
  namespace: traefik
  labels:
    app.kubernetes.io/name: error-pages
spec:
  entryPoints:
    - websecure
  routes:
    - match: PathPrefix(`/`)
      kind: Rule
      priority: 1
      services:
        - name: error-pages
          port: 8080
