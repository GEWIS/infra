apiVersion: v1
kind: ConfigMap
metadata:
  name: traefik-error-pages-nginx
  namespace: traefik
  labels:
    app.kubernetes.io/name: error-pages
data:
  nginx.conf: |
    # "daemon off;" is provided by the container command (`nginx -g`),
    # declaring it again here makes nginx exit with a duplicate directive.
    worker_processes 1;
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;
    
    events {
        worker_connections 256;
    }
    
    http {
        access_log /dev/stdout;
        default_type text/html;
    
        map $code $reason {
            400 "Bad Request";
            401 "Unauthorized";
            403 "Forbidden";
            404 "Not Found";
            408 "Request Timeout";
            410 "Gone";
            413 "Content Too Large";
            429 "Too Many Requests";
            500 "Internal Server Error";
            501 "Not Implemented";
            502 "Bad Gateway";
            503 "Service Unavailable";
            504 "Gateway Timeout";
            505 "HTTP Version Not Supported";
            507 "Insufficient Storage";
            511 "Network Authentication Required";
            default "Error";
        }
    
        server {
            listen 8080;
    
            # Traefik's errors middleware asks for /{status}.html; the status of the
            # failed response travels in the path. The captured code and the mapped
            # reason phrase are echoed into the page through SSI.
            location ~ "^/(?<code>[1-5][0-9]{2})\.html$" {
                ssi on;
                default_type text/html;
                alias /etc/nginx/page.html;
            }
    
            location / {
                return 404;
            }
        }
    }
  page.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>HTTP <!--#echo var="code" --> &mdash; GEWIS</title>
    <style>
    body{
      margin:0;min-height:100vh;display:flex;flex-direction:column;justify-content:center;
      background:#D40000;color:#fff;
      font-family:Raleway,-apple-system,"Segoe UI",sans-serif;text-align:center;
    }
    img{width:min(60vw,18rem);margin:0 auto 2.5rem}
    h1{margin:0 0 1rem;font-size:1.5rem;font-weight:600}
    p{margin:0 0 1rem;line-height:1.6}
    main{padding:3rem 2rem}
    a{color:#fff}
    </style>
    </head>
    <body>
    <main>
    <img alt="GEWIS" src="data:image/svg+xml;base64,"/>
    <h1>HTTP <!--#echo var="code" --> &mdash; <!--#echo var="reason" --></h1>
    <p>The server could not serve the page you requested and answered with the error above.</p>
    <p>If you think this is incorrect, please email <a href="mailto:cbc@gewis.nl">cbc@gewis.nl</a>.</p>
    </main>
    </body>
    </html>
