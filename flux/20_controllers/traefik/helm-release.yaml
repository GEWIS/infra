apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  releaseName: traefik
  interval: 1h
  chart:
    spec:
      chart: traefik
      version: "41.6.1"
      sourceRef:
        kind: HelmRepository
        name: traefik
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    deployment:
      kind: DaemonSet
      additionalVolumes:
        - name: real-ip-plugin
          configMap:
            name: traefik-real-ip
    experimental:
      plugins:
        traefik-oidc-auth:
          moduleName: github.com/sevensolutions/traefik-oidc-auth
          version: v0.18.0
      localPlugins:
        real-ip:
          type: localPath
          moduleName: github.com/gewis/traefik-real-ip
          mountPath: /plugins-local/src/github.com/gewis/traefik-real-ip
          volumeName: real-ip-plugin
    service:
      annotations:
        lbipam.cilium.io/ips: 10.82.50.10
      spec:
        externalTrafficPolicy: Local
    ingressClass:
      enabled: true
      isDefaultClass: true
      name: traefik
    ports:
      web:
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
      websecure:
        asDefault: true
        http:
          middlewares:
            - traefik-real-ip@kubernetescrd
            - traefik-error-pages@kubernetescrd
        forwardedHeaders:
          trustedIPs:
            - 131.155.10.134
            - 131.155.10.135
            - 145.116.44.49
            - 145.116.47.68
        transport:
          respondingTimeouts:
            readTimeout: 0
    tlsStore:
      default:
        defaultCertificate:
          secretName: wildcard-cbc-gewis-nl-tls
