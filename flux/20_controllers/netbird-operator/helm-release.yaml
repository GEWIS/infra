apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: netbird-operator
  namespace: netbird-operator
spec:
  releaseName: netbird-operator
  interval: 1h
  chart:
    spec:
      chart: netbird-operator
      version: "0.8.0"
      sourceRef:
        kind: HelmRepository
        name: netbirdio-charts
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    managementURL: https://nb.gewis.nl
    cluster:
      name: gewis
    webhook:
      failurePolicy: Ignore
    operator:
      replicaCount: 2
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: netbird-operator
