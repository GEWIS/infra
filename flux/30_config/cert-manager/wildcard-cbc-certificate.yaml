apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-cbc-gewis-nl
  namespace: traefik
spec:
  secretName: wildcard-cbc-gewis-nl-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - gewis.nl
    - "*.gewis.nl"
    - "*.test.gewis.nl"
    - "*.personal.gewis.nl"
    - "*.docker-registry.gewis.nl"
    - registry.net.gewis.nl
    - gew.is
    - "*.gew.is"
