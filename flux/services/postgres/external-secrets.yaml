apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: provisioner
  namespace: postgres
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: postgres
    kind: SecretStore
  target:
    name: provisioner-role
    template:
      type: kubernetes.io/basic-auth
  data:
    - secretKey: username
      remoteRef:
        key: provisioner
        property: username
    - secretKey: password
      remoteRef:
        key: provisioner
        property: password
