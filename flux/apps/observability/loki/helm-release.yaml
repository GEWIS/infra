apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: observability
spec:
  releaseName: loki
  interval: 1h
  chart:
    spec:
      chart: loki
      version: "7.2.0"
      sourceRef:
        kind: HelmRepository
        name: grafana
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    deploymentMode: SingleBinary

    loki:
      podAnnotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3100"
      auth_enabled: true
      commonConfig:
        replication_factor: 1
        path_prefix: /var/loki
      storage:
        type: s3
        bucketNames:
          chunks: loki
          ruler: loki
        s3:
          endpoint: s3.gewis.nl:3900
          region: garage
          accessKeyId: ${S3_ACCESS_KEY_ID}
          secretAccessKey: ${S3_SECRET_ACCESS_KEY}
          s3ForcePathStyle: true
          insecure: true
      schemaConfig:
        configs:
          - from: "2026-01-01"
            store: tsdb
            object_store: s3
            schema: v13
            index:
              prefix: index_
              period: 24h
      querier:
        multi_tenant_queries_enabled: true
      compactor:
        retention_enabled: true
        delete_request_store: s3
      limits_config:
        retention_period: 720h
        volume_enabled: true
      podSecurityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsUser: 10001

    singleBinary:
      replicas: 1
      extraArgs:
        - "-config.expand-env=true"
      extraEnvFrom:
        - secretRef:
            name: loki-s3
      persistence:
        enabled: true
        size: 2Gi
        storageClass: longhorn

    gateway:
      enabled: false
    minio:
      enabled: false
    lokiCanary:
      enabled: false
    resultsCache:
      enabled: false
    chunksCache:
      enabled: false
    test:
      enabled: false

    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0
    ingester:
      replicas: 0
    querier:
      replicas: 0
    queryFrontend:
      replicas: 0
    queryScheduler:
      replicas: 0
    distributor:
      replicas: 0
    compactor:
      replicas: 0
    indexGateway:
      replicas: 0
    bloomPlanner:
      replicas: 0
    bloomBuilder:
      replicas: 0
    bloomGateway:
      replicas: 0
