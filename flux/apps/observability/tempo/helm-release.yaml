apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tempo
  namespace: observability
spec:
  releaseName: tempo
  interval: 1h
  chart:
    spec:
      chart: tempo
      version: "2.2.3"
      sourceRef:
        kind: HelmRepository
        name: grafana-community
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    replicas: 1

    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "3200"

    tempo:
      multitenancyEnabled: true
      reportingEnabled: false
      retention: 720h

      extraArgs:
        config.expand-env: "true"
      extraEnvFrom:
        - secretRef:
            name: tempo-s3

      storage:
        trace:
          backend: s3
          s3:
            bucket: tempo
            endpoint: s3.gewis.nl:3900
            region: garage
            access_key: ${S3_ACCESS_KEY_ID}
            secret_key: ${S3_SECRET_ACCESS_KEY}
            insecure: true
            forcepathstyle: true
          wal:
            path: /var/tempo/wal

      queryFrontend:
        multi_tenant_queries_enabled: true

      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: "0.0.0.0:4317"
            http:
              endpoint: "0.0.0.0:4318"

    persistence:
      enabled: true
      size: 1Gi
      storageClassName: longhorn
