apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: loki-s3
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: loki-s3
  data:
    - secretKey: S3_ACCESS_KEY_ID
      remoteRef:
        key: observability/loki
        property: access_key_id
    - secretKey: S3_SECRET_ACCESS_KEY
      remoteRef:
        key: observability/loki
        property: secret_access_key
---
