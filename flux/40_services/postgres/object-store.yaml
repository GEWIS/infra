apiVersion: v1
kind: ServiceAccount
metadata:
  name: seaweedfs
  namespace: postgres
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: seaweedfs
  namespace: postgres
spec:
  provider:
    vault:
      server: http://openbao-active.openbao.svc:8200
      path: seaweedfs
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: seaweedfs-postgres
          serviceAccountRef:
            name: seaweedfs
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-s3
  namespace: postgres
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: seaweedfs
    kind: SecretStore
  target:
    name: postgres-s3
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: postgres/postgres
        property: access_key_id
    - secretKey: SECRET_ACCESS_KEY
      remoteRef:
        key: postgres/postgres
        property: secret_access_key
    - secretKey: REGION
      remoteRef:
        key: postgres/postgres
        property: region
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: postgres
  namespace: postgres
spec:
  retentionPolicy: "30d"
  configuration:
    destinationPath: s3://postgres/
    endpointURL: http://s3.gewis.nl:8333
    s3Credentials:
      accessKeyId:
        name: postgres-s3
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: postgres-s3
        key: SECRET_ACCESS_KEY
      region:
        name: postgres-s3
        key: REGION
    wal:
      compression: gzip
    data:
      compression: gzip
  instanceSidecarConfiguration:
    env:
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: postgres-daily
  namespace: postgres
spec:
  schedule: "0 0 3 * * *"
  immediate: true
  backupOwnerReference: self
  cluster:
    name: postgres
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
