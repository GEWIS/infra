apiVersion: v1
kind: Service
metadata:
  name: s3-01
  namespace: s3
spec:
  ports:
    - name: s3
      port: 8333
      targetPort: 8333
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: s3-01
  namespace: s3
  labels:
    kubernetes.io/service-name: s3-01
    endpointslice.kubernetes.io/managed-by: flux
addressType: IPv4
ports:
  - name: s3
    port: 8333
    protocol: TCP
endpoints:
  - addresses:
      - 10.82.50.100
