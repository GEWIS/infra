apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: controllers
  namespace: flux-system
spec:
  dependsOn:
    - name: sealed-secrets
  interval: 1h
  retryInterval: 1m
  path: ./flux/controllers
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
