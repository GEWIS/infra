apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: services
  namespace: flux-system
spec:
  dependsOn:
    - name: config
    - name: openbao
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  path: ./flux/services
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
