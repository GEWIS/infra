apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: secret-store
  namespace: flux-system
spec:
  dependsOn:
    - name: openbao
  interval: 1h
  retryInterval: 1m
  path: ./flux/secret-store
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
