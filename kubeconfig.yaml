apiVersion: v1
kind: Config
clusters:
  - name: gewis
    cluster:
      server: https://gewis.netbird-kubeapi-proxy.net.nb.gewis.nl
      insecure-skip-tls-verify: true
users:
  - name: netbird
    user:
      token: none
contexts:
