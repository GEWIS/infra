name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: .sops.yaml matches nix/recipients.nix
        run: nix build --no-link --print-build-logs .#checks.x86_64-linux.sops-config

      - name: flake evaluates and every host builds a derivation
        run: nix flake check --print-build-logs
