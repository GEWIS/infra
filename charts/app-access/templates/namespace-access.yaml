{{- if eq .Values.render "access" }}
{{- range $app := .Values.apps }}
{{- range $namespace := $app.namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $app.name }}-access
  namespace: {{ $namespace }}
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $app.name }}-access
  namespace: {{ $namespace }}
subjects:
  - kind: Group
    name: {{ $app.group | quote }}
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: {{ $app.name }}-access
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}
{{- end }}
